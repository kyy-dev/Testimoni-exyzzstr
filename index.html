<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exyzz STR | Verified Testimonials</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'exyzz-bg': '#191919',
                        'exyzz-card': '#202020',
                        'exyzz-border': '#333333',
                        'exyzz-red': '#B93636',
                        'exyzz-text': '#E0E0E0',
                        'wa-green': '#22c55e',
                    },
                    fontFamily: {
                        'head': ['Oswald', 'sans-serif'],
                        'body': ['Titillium Web', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #191919; color: #E0E0E0; font-family: 'Titillium Web', sans-serif; scroll-behavior: smooth; }
        * { border-radius: 0 !important; }
        
        /* Neo-Brutalism Style */
        .neo-card { 
            border: 2px solid #333; 
            background: #202020; 
            transition: all 0.2s ease;
        }
        .neo-card:hover { 
            border-color: #B93636; 
            box-shadow: 8px 8px 0px 0px #B93636; 
            transform: translate(-4px, -4px); 
        }

        .neo-btn { 
            background: #B93636; 
            color: white; 
            border: 2px solid #000; 
            box-shadow: 4px 4px 0px 0px #000; 
            transition: all 0.1s; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .neo-btn:hover { 
            transform: translate(-2px, -2px); 
            box-shadow: 6px 6px 0px 0px #FFFFFF; 
        }
        .neo-btn:active { 
            transform: translate(2px, 2px); 
            box-shadow: 0px 0px 0px 0px #000; 
        }

        .scribble-title {
            position: relative;
            display: inline-block;
        }
        .scribble-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 2px;
            width: 100%;
            height: 10px;
            background: #B93636;
            z-index: -1;
            opacity: 0.4;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #191919; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #B93636; }
    </style>
</head>
<body class="bg-exyzz-bg pb-24">

    <nav class="border-b-2 border-exyzz-border bg-exyzz-bg sticky top-0 z-50 p-4">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="font-head text-2xl font-bold tracking-tighter text-exyzz-red">EXYZZ STR</h1>
            <div class="text-[10px] font-head uppercase border-2 border-exyzz-border px-3 py-1">
                Verified System
            </div>
        </div>
    </nav>

    <div class="max-w-xl mx-auto p-6">
        <header class="mb-10 text-center md:text-left">
            <h2 class="font-head text-5xl font-bold uppercase leading-none mb-3 scribble-title">TESTIMONI</h2>
            <p class="text-zinc-500 text-sm uppercase tracking-widest font-head">Verified Transaction History</p>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-12">
            <a href="https://website-jb.vercel.app/" target="_blank" class="neo-card p-3 flex flex-col gap-1 group">
                <span class="text-[9px] font-head text-zinc-500 uppercase">Official</span>
                <b class="text-xs font-head uppercase group-hover:text-exyzz-red transition">Website JB</b>
            </a>
            <a href="https://wa.me/6285168854965" target="_blank" class="neo-card p-3 flex flex-col gap-1 group">
                <span class="text-[9px] font-head text-zinc-500 uppercase">Direct</span>
                <b class="text-xs font-head uppercase group-hover:text-exyzz-red transition">Admin Utama</b>
            </a>
            <a href="https://chat.whatsapp.com/KJX3eCeOHmu8UoZyl1iWxR" target="_blank" class="neo-card p-3 flex flex-col gap-1 group">
                <span class="text-[9px] font-head text-zinc-500 uppercase">Community</span>
                <b class="text-xs font-head uppercase group-hover:text-exyzz-red transition">WhatsApp Group</b>
            </a>
            <a href="https://tiktok.com/@exyzzstr11" target="_blank" class="neo-card p-3 flex flex-col gap-1 group">
                <span class="text-[9px] font-head text-zinc-500 uppercase">Social</span>
                <b class="text-xs font-head uppercase group-hover:text-exyzz-red transition">TikTok Oficial</b>
            </a>
        </div>

        <div id="testi-list" class="space-y-8">
            <div class="neo-card p-10 text-center border-dashed border-zinc-700">
                <p class="font-head uppercase tracking-widest text-zinc-600">Sychronizing Database...</p>
            </div>
        </div>
    </div>

    <div class="fixed bottom-6 right-6 md:right-12 z-50">
        <a href="https://wa.me/6285168854965" class="neo-btn font-head uppercase px-6 py-4 font-bold text-sm tracking-widest">
            <i class="fab fa-whatsapp fa-lg"></i>
            Hubungi Admin
        </a>
    </div>

<script>
const CFG = {
    user: "kyy-dev",
    repo: "Testimoni-exyzzstr",
    file: "testi.json"
};

function safeDecode(str) {
    try {
        return decodeURIComponent(escape(atob(str)));
    } catch (e) {
        return atob(str);
    }
}

async function loadData() {
    const list = document.getElementById("testi-list");
    
    try {
        const res = await fetch(`https://api.github.com/repos/${CFG.user}/${CFG.repo}/contents/${CFG.file}?t=${Date.now()}`);
        if (!res.ok) throw new Error();

        const jsonRes = await res.json();
        const rawContent = safeDecode(jsonRes.content);
        const data = JSON.parse(rawContent);

        if (data.length === 0) {
            list.innerHTML = `<div class="neo-card p-10 text-center font-head text-zinc-500 uppercase border-dashed border-zinc-700">Belum ada riwayat transaksi.</div>`;
            return;
        }

        list.innerHTML = data.reverse().map((t, index) => `
            <div class="neo-card overflow-hidden">
                <div class="bg-exyzz-border p-3 flex justify-between items-center border-b-2 border-zinc-800">
                    <span class="font-head text-xs font-bold text-exyzz-red uppercase tracking-tight">${t.buyer}</span>
                    <span class="text-[9px] font-head text-zinc-400 uppercase italic"><i class="far fa-calendar-alt"></i> ${t.date}</span>
                </div>
                
                <div class="p-5">
                    <div class="flex items-center gap-2 mb-4">
                        <div class="w-3 h-3 bg-green-500"></div>
                        <h4 class="font-head text-xl font-bold uppercase tracking-tight text-exyzz-text">${t.item}</h4>
                    </div>

                    ${t.img ? `
                        <div class="border-2 border-zinc-800 mb-4 overflow-hidden bg-black/30 group">
                            <img src="https://raw.githubusercontent.com/${CFG.user}/${CFG.repo}/main/${t.img}" 
                                 class="w-full h-auto object-cover transition-transform duration-500 group-hover:scale-105" 
                                 alt="Proof of Transaction"
                                 loading="lazy">
                        </div>
                    ` : ""}

                    <div class="bg-zinc-900/50 p-4 border-l-4 border-exyzz-red">
                        <p class="text-sm italic text-zinc-300 font-body">"${t.msg}"</p>
                    </div>
                </div>
                <div class="bg-zinc-900 p-2 text-center border-t border-zinc-800">
                   <span class="text-[8px] font-head text-zinc-600 uppercase tracking-[0.4em]">Ky Dev - verified Transaction Record</span>
                </div>
            </div>
        `).join('');

    } catch (err) {
        list.innerHTML = `
            <div class="neo-card p-10 text-center border-exyzz-red">
                <i class="fas fa-exclamation-triangle fa-2x text-exyzz-red mb-4"></i><br>
                <b class="font-head text-exyzz-red uppercase text-xl">Sinkronisasi Database Gagal</b><br>
                <p class="text-xs text-zinc-500 mt-2">Cek koneksi internet Anda atau coba segarkan halaman ini.</p>
            </div>`;
    }
}

loadData();
</script>
</body>
</html>
